open_search:
  host: opensearch
  port: 9200

qdrant:
  host: qdrant
  port: 6333

embedding:
  # 可用 SECVAL_EMBEDDING_PROVIDER=api 覆盖为远程 Embedding API。
  provider: local
  model_name: Qwen/Qwen3-Embedding-0.6B
  dimension: 1024
  device: cpu
  max_sequence_length: 512

fusion:
  candidate_multiplier: 3
  max_candidate_count: 100

reranker:
  provider: local
  model_name: BAAI/bge-reranker-base
  device: cpu
  candidate_count: 10
  max_sequence_length: 256
  batch_size: 8
