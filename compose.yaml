name: secval

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secval-api
    environment:
      - HF_HOME=/models/huggingface
      - HF_HUB_DISABLE_XET=1
      - PYTHONUNBUFFERED=1
      - SECVAL_REPOSITORIES_ROOT=/repositories
      # 默认仍使用本地模型；在 .env 中设置为 api 即可切换远程向量服务。
      - SECVAL_EMBEDDING_PROVIDER=${SECVAL_EMBEDDING_PROVIDER:-local}
      - SECVAL_EMBEDDING_API_URL=${SECVAL_EMBEDDING_API_URL:-}
      - SECVAL_EMBEDDING_API_KEY=${SECVAL_EMBEDDING_API_KEY:-}
      - SECVAL_EMBEDDING_API_MODEL=${SECVAL_EMBEDDING_API_MODEL:-qwen3.7-text-embedding}
      - SECVAL_EMBEDDING_API_DIMENSION=${SECVAL_EMBEDDING_API_DIMENSION:-1024}
      - SECVAL_EMBEDDING_API_BATCH_SIZE=${SECVAL_EMBEDDING_API_BATCH_SIZE:-64}
      - SECVAL_EMBEDDING_API_TIMEOUT_SECONDS=${SECVAL_EMBEDDING_API_TIMEOUT_SECONDS:-120}
      # API 模型必须使用独立 Collection，不能与本地模型向量混用。
      - SECVAL_VECTOR_COLLECTION=${SECVAL_VECTOR_COLLECTION:-secval-code-vectors-qwen3-06b-v2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config/search.docker.yaml:/app/config/search.yaml:ro
      - huggingface-cache:/models/huggingface
      # API 需要把浏览器上传的仓库保存到这个目录。
      - ./data/repositories:/repositories
    networks:
      - services
    depends_on:
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl --silent --fail http://localhost:8000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: secval-opensearch
    environment:
      - cluster.name=secval-search
      - node.name=secval-opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - services
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl --silent --fail http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: secval-qdrant
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - services
    restart: unless-stopped

volumes:
  opensearch-data:
  qdrant-data:
  huggingface-cache:

networks:
  services:
