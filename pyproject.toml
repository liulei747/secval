[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secval"
version = "0.1.0"
description = "Code analysis and hybrid search platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "opensearch-py==3.2.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.19.0",
    "sentence-transformers==5.7.0",
    "tree-sitter==0.26.0",
    "tree-sitter-java==0.23.5",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Windows bind mounts会把普通 Python 文件呈现为可执行；配置格式错误统一对外报告 ValueError。
ignore = ["EXE002", "TRY004"]

[tool.ruff.lint.per-file-ignores]
# 健康检查是故障边界：任何客户端异常都应转换成 503，而不是让检查本身崩溃。
"src/secval/web_api/search_api.py" = ["BLE001"]
