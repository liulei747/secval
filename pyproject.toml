[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secval"
version = "0.1.0"
description = "Code analysis and hybrid search platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "opensearch-py==3.2.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.19.0",
    "sentence-transformers==5.7.0",
    "tree-sitter==0.26.0",
    "tree-sitter-java==0.23.5",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
